<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board - AI Task Manager</title>
  <meta name="description" content="Visual Kanban task board. Drag and drop to update statuses, track subtask percentages, and generate tasks using AI.">
  
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/taskboard.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="navbar" id="app-navbar">
    <a href="/pages/dashboard.html" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      <span>AI Task Manager</span>
    </a>
    <div class="nav-actions">
      <!-- Dark Mode Switcher -->
      <button id="dark-mode-toggle" class="nav-btn" aria-label="Toggle Dark Mode">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Authenticated User Profile -->
      <div class="nav-user">
        <img id="user-avatar" class="nav-avatar" src="" alt="Avatar placeholder">
        <span id="user-name" class="nav-username">Loading User...</span>
      </div>

      <!-- Logout Action -->
      <button id="btn-logout" class="btn-logout">Logout</button>
    </div>
  </nav>

  <!-- Kanban Board Workspace -->
  <main class="board-container">
    <div class="board-header">
      <div>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Task Board</h1>
        <p style="font-size: 0.95rem; color: var(--text-secondary); margin-top: 0.25rem;">
          Drag and drop cards between status lists, or click to edit details and subtasks.
        </p>
      </div>
      <a href="/pages/dashboard.html" class="btn-secondary" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.95rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        <span>View Dashboard</span>
      </a>
    </div>

    <!-- Column Boards Grid -->
    <div class="board-columns" aria-label="Kanban columns">
      <!-- TO DO Column -->
      <section class="board-column" aria-labelledby="todo-col-title">
        <div class="column-header">
          <div class="column-title" id="todo-col-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>To Do</span>
          </div>
          <span class="column-count" id="todo-count">0</span>
        </div>
        <div class="task-list" id="todo-list">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- IN PROGRESS Column -->
      <section class="board-column" aria-labelledby="inprogress-col-title">
        <div class="column-header">
          <div class="column-title" id="inprogress-col-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--priority-medium);">
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
              <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
              <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
            <span>In Progress</span>
          </div>
          <span class="column-count" id="inprogress-count">0</span>
        </div>
        <div class="task-list" id="inprogress-list">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- DONE Column -->
      <section class="board-column" aria-labelledby="done-col-title">
        <div class="column-header">
          <div class="column-title" id="done-col-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--priority-low);">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Done</span>
          </div>
          <span class="column-count" id="done-count">0</span>
        </div>
        <div class="task-list" id="done-list">
          <!-- Populated dynamically -->
        </div>
      </section>
    </div>
  </main>

  <!-- Floating Add Task Button -->
  <button id="btn-open-create" class="fab-add-task" aria-label="Add Task">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- Add/Edit Task Modal Overlay -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Add New Task</h2>
        <button class="nav-btn" id="btn-cancel-task" aria-label="Close modal">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Title Input -->
        <div class="form-group">
          <label class="form-label" for="task-title">Title</label>
          <input class="form-input" id="task-title" type="text" placeholder="What needs to be done?">
        </div>

        <!-- Description Input -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
            <label class="form-label" for="task-desc" style="margin-bottom: 0;">Description</label>
            <button type="button" id="btn-ai-write-desc" style="background: none; border: none; color: var(--primary); font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.25rem; transition: var(--transition-smooth);">
              <span>✍️ Write Description</span>
            </button>
          </div>
          <textarea class="form-input" id="task-desc" placeholder="Add description details..."></textarea>
          <span id="tag-ai-written" style="display: none; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; font-style: italic;">
            🪄 AI written
          </span>
        </div>

        <!-- Inputs Row -->
        <div class="form-row">
          <!-- Priority Selector -->
          <div class="form-group">
            <label class="form-label" for="task-priority">Priority</label>
            <select class="form-input" id="task-priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <!-- Deadline Input -->
          <div class="form-group">
            <label class="form-label" for="task-due-date">Due Date</label>
            <input class="form-input" id="task-due-date" type="date">
          </div>
        </div>

        <!-- Subtasks Section -->
        <section class="subtasks-section">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label">Subtasks / Checklist Steps</label>
            <button type="button" class="btn-add-subtask-action" id="btn-add-subtask-action">
              + Add Subtask
            </button>
          </div>
          <div class="subtasks-list-edit" id="subtasks-list-edit">
            <!-- JS Appends checklist rows here -->
          </div>
        </section>
      </div>

      <!-- Action Footer -->
      <div class="modal-footer">
        <!-- Left Side Actions -->
        <div class="modal-footer-left">
          <button type="button" class="btn-danger-action" id="btn-delete-task">
            Delete Task
          </button>
        </div>
        <!-- Right Side Actions -->
        <div class="modal-footer-right">
          <!-- Gemini Suggest -->
          <button type="button" class="btn-ai-suggest" id="btn-ai-suggest">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>AI Suggest</span>
          </button>
          <!-- Standard triggers -->
          <button type="button" class="btn-secondary" id="btn-cancel-task-footer">Cancel</button>
          <button type="button" class="btn-primary" id="btn-save-task">Save Task</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CDN scripts -->
  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- App scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/taskboard.js"></script>
  <script src="/js/ai.js"></script>

  <!-- Cancel footer binding -->
  <script>
    document.getElementById('btn-cancel-task-footer').addEventListener('click', () => {
      if (typeof window.closeTaskModal === 'function') {
        window.closeTaskModal();
      }
    });
  </script>
</body>
</html>
